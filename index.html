<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Route Explorer</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <div id="map-title">
      <h1>Street Route Explorer</h1>
      <p class="subtitle">Draw · Snap · Tour</p>
    </div>

    <aside id="sidebar">
      <div id="drag-handle"></div>

      <div id="sheet-header">
        <button id="clear-btn" class="btn secondary btn-sm" disabled>Clear</button>
      </div>

      <div id="status">
        <div id="spinner" class="spinner hidden"></div>
        <p id="status-text">Loading map…</p>
      </div>

      <div id="route-info" class="hidden">
        <div class="info-cell">
          <div class="info-label">Distance</div>
          <div class="info-value" id="distance">—</div>
        </div>
        <div class="info-cell">
          <div class="info-label">Est. Walk</div>
          <div class="info-value" id="duration">—</div>
        </div>
      </div>

      <div id="directions-panel" class="hidden">
        <h2>Turn-by-Turn</h2>
        <ol id="directions-list"></ol>
      </div>

      <div id="current-step" class="hidden">
        <span id="current-step-icon" class="step-icon"></span>
        <div class="step-body">
          <span id="current-step-text" class="step-text"></span>
          <span id="current-step-dist" class="step-dist"></span>
        </div>
      </div>

      <div id="action-footer">
        <button id="draw-btn" class="btn primary btn-full" disabled>Draw Route</button>
        <div id="tour-controls" class="hidden">
          <button id="tour-btn" class="btn primary btn-full">&#9658; Start Tour</button>
          <div id="tour-speed" class="hidden">
            <div class="speed-row">
              <span>Speed: <strong id="speed-label">1&times;</strong></span>
            </div>
            <input type="range" id="speed-slider" min="1" max="5" value="1" step="1">
            <button id="stop-tour-btn" class="btn secondary btn-full">&#9632; Stop Tour</button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
